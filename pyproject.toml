[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "react-agent0"
version = "0.0.0"
description = "Minimal assignment harness; learners implement everything in react_agent/"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "openai>=1.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["react_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Keep essential error checks; allow unused imports/variables and style variations.
select = ["E9", "F63", "F7", "F82"]
